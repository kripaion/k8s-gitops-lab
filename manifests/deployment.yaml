apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-custom-app
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: custom-app
  template:
    metadata:
      labels:
        app: custom-app
    spec:
      containers:
      - name: app
        image: kripaion/my-app:e9bea8c2a7c98b6a57fdfa1d01ac7ca983a77b6f
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: my-custom-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: custom-app
  ports:
    - port: 80
      targetPort: 3000
