apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-custom-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: custom-app
  template:
    metadata:
      labels:
        app: custom-app
    spec:
      containers:
      - name: app
        image: kripaion/my-app:9a95cf492e832c77c2827121e583f9a22b22dcbb
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: my-custom-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: sample-web
  ports:
    - port: 80
      targetPort: 3000
