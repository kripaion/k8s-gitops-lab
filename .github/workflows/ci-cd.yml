name: Build and Update GitOps Manifest

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/my-app:${{ github.sha }}

    - name: Update deployment image tag
      run: |
        # Update image tag in deployment.yaml automatically with the latest git commit sha
        sed -i 's|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/my-app:${{ github.sha }}|g' deployment.yaml

        # Configure git user to commit changes
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "bot@github.com"

        git add deployment.yaml
        git commit -m "Update image tag to ${{ github.sha }}"
        git push origin main
